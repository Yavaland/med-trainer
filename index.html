<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Медицинский тренажёр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🩺 Медицинский тренажёр</h1>
            <button class="btn btn-danger btn-sm" id="resetBtn">Сбросить</button>
        </header>

        <div class="stats-panel">
            <div class="stats-text" id="stats">
                <span>Загрузка...</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="bar"></div>
            </div>
        </div>

        <div class="question-card" id="card">
            <div class="question-text" id="question"></div>
            <div class="answers-list" id="answers"></div>
            <div class="result-message" id="result"></div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="prevBtn">← Назад</button>
            <button class="btn btn-primary" id="checkBtn">Проверить</button>
            <button class="btn btn-secondary" id="nextBtn">Вперёд →</button>
        </div>

        <div class="jump-panel">
            <label for="jumpInput">Перейти к вопросу:</label>
            <input type="number" id="jumpInput" min="1" placeholder="№">
            <button class="btn btn-outline" id="jumpBtn">OK</button>
        </div>

        <div class="hotkeys-hint">
            Горячие клавиши: <kbd>1</kbd>-<kbd>9</kbd> — ответ ·
            <kbd>Enter</kbd> — проверить ·
            <kbd>←</kbd><kbd>→</kbd> — навигация
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
