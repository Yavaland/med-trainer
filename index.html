<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Медицинский тренажёр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🩺 Медицинский тренажёр</h1>
            <div class="header-buttons">
                <button class="btn btn-theme" id="themeToggle" title="Переключить тему">🌙</button>
                <button class="btn btn-danger btn-sm" id="resetBtn">Сброс</button>
            </div>
        </header>

        <div class="stats-panel">
            <div class="stats-text" id="stats"><span>Загрузка...</span></div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="bar"></div>
            </div>
        </div>

        <div class="filter-panel">
            <button class="btn btn-filter active" id="showAllBtn">Все</button>
            <button class="btn btn-filter" id="showWrongBtn">❌ Ошибки</button>
            <button class="btn btn-filter" id="showCorrectBtn">✅ Верно</button>
            <button class="btn btn-filter" id="showUnansweredBtn">⚪ Новые</button>
        </div>

        <div class="search-panel">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по вопросу...">
            <button class="btn btn-outline btn-sm" id="clearSearchBtn">✕</button>
        </div>

        <div class="question-card" id="card">
            <div class="question-number" id="questionNumber"></div>
            <div class="question-text" id="question"></div>
            <div class="answers-list" id="answers"></div>
            <div class="result-message" id="result"></div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="prevBtn">← Назад</button>
            <button class="btn btn-primary" id="checkBtn">Проверить</button>
            <button class="btn btn-outline" id="showAnswerBtn">💡 Показать ответ</button>
            <button class="btn btn-secondary" id="nextBtn">Вперёд →</button>
        </div>

        <div class="jump-panel">
            <label for="jumpInput">Вопрос №:</label>
            <input type="number" id="jumpInput" min="1" placeholder="№">
            <button class="btn btn-outline" id="jumpBtn">OK</button>
        </div>

        <div class="hotkeys-hint">
            Горячие клавиши: <kbd>1</kbd>-<kbd>9</kbd> — выбрать · 
            <kbd>Enter</kbd> — проверить · 
            <kbd>←</kbd><kbd>→</kbd> — навигация · 
            <kbd>H</kbd> — показать ответ
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
